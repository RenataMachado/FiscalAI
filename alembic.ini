[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# A URL de conexão NÃO fica aqui (evita segredo versionado no git).
# Ela é montada dinamicamente em alembic/env.py a partir da variável
# de ambiente DATABASE_URL (mesmo .env que o app já usa).
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
